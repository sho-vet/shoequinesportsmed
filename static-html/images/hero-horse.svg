    <path d="M-10,-70 C25,-70 45,-45 45,-15 C45,10 30,25 30,45 L35,75 L-45,75 L-40,20 C-55,10 -62,-10 -55,-30 C-48,-52 -30,-70 -10,-70 Z" />
